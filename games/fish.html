<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishing Frenzy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            overflow: hidden;
            background: linear-gradient(#4fc3f7, #0288d1);
        }

        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .ocean {
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(to bottom,
                    rgba(255, 255, 255, .3),
                    transparent 20%);
        }

        .ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, .4);
        }

        .fish {
            position: absolute;
            font-size: 50px;
            cursor: pointer;
            user-select: none;
            transition: transform .15s;
        }

        .fish:hover {
            transform: scale(1.15);
        }

        .game-over {
            position: absolute;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, .7);
            color: white;
            flex-direction: column;
            z-index: 20;
        }

        .game-over h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .game-over button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #22c55e;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }

        .splash {
            position: absolute;
            font-size: 30px;
            pointer-events: none;
            animation: splash .8s forwards;
        }

        @keyframes splash {
            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0;
                transform: translateY(-50px);
            }
        }
    </style>
    <script type="text/javascript" data-cfasync="false" src="../scripts/ad-network.js"></script>
</head>

<body>

    <div id="game">

        <div class="ocean"></div>

        <div class="ui">
            🎣 Score: <span id="score">0</span><br>
            💰 Coins: <span id="coins">0</span><br>
            ⏱️ Time: <span id="time">60</span>s
        </div>

        <div class="game-over" id="gameOver">
            <h1>🎣 Fishing Complete!</h1>
            <h2 id="finalScore"></h2>
            <button onclick="restartGame()">
                Play Again
            </button>
        </div>

    </div>

    <script>

        const game =
            document.getElementById("game");

        const scoreDisplay =
            document.getElementById("score");

        const coinDisplay =
            document.getElementById("coins");

        const timeDisplay =
            document.getElementById("time");

        const gameOverScreen =
            document.getElementById("gameOver");

        let score = 0;
        let coins = 0;
        let timeLeft = 60;
        let gameRunning = true;

        const fishTypes = [
            { emoji: "🐟", value: 10 },
            { emoji: "🐠", value: 20 },
            { emoji: "🐡", value: 30 },
            { emoji: "🦈", value: 50 },
            { emoji: "🐬", value: 100 }
        ];

        function spawnFish() {

            if (!gameRunning) return;

            const fishData =
                fishTypes[
                Math.floor(
                    Math.random() *
                    fishTypes.length
                )
                ];

            const fish =
                document.createElement("div");

            fish.classList.add("fish");

            fish.textContent =
                fishData.emoji;

            const startLeft =
                Math.random() < 0.5;

            fish.style.left =
                startLeft ? "-100px" : "100vw";

            fish.style.top =
                Math.random() *
                (window.innerHeight - 100)
                + "px";

            game.appendChild(fish);

            let x =
                startLeft ? -100 :
                    window.innerWidth + 100;

            const speed =
                2 + Math.random() * 3;

            const direction =
                startLeft ? 1 : -1;

            if (!startLeft) {
                fish.style.transform =
                    "scaleX(-1)";
            }

            const move =
                setInterval(() => {

                    x += speed * direction;

                    fish.style.left =
                        x + "px";

                    if (
                        x < -150 ||
                        x > window.innerWidth + 150
                    ) {

                        clearInterval(move);

                        if (fish.parentNode)
                            fish.remove();
                    }

                }, 16);

            fish.addEventListener("click", () => {

                if (!gameRunning) return;

                score += fishData.value;
                coins += Math.floor(
                    fishData.value / 2
                );

                updateUI();

                createSplash(
                    fish.offsetLeft,
                    fish.offsetTop,
                    "+" + fishData.value
                );

                clearInterval(move);
                fish.remove();
            });

            setTimeout(
                spawnFish,
                500 + Math.random() * 1000
            );
        }

        function createSplash(x, y, text) {

            const splash =
                document.createElement("div");

            splash.classList.add("splash");

            splash.textContent =
                text;

            splash.style.left =
                x + "px";

            splash.style.top =
                y + "px";

            game.appendChild(splash);

            setTimeout(() => {
                splash.remove();
            }, 800);
        }

        function updateUI() {

            scoreDisplay.textContent =
                score;

            coinDisplay.textContent =
                coins;
        }

        function startTimer() {

            const timer =
                setInterval(() => {

                    if (!gameRunning) {

                        clearInterval(timer);
                        return;
                    }

                    timeLeft--;

                    timeDisplay.textContent =
                        timeLeft;

                    if (timeLeft <= 0) {

                        clearInterval(timer);
                        endGame();
                    }

                }, 1000);
        }

        function endGame() {

            gameRunning = false;

            document
                .querySelectorAll(".fish")
                .forEach(f => f.remove());

            gameOverScreen.style.display =
                "flex";

            document
                .getElementById("finalScore")
                .innerHTML =
                `
        🏆 Score: ${score}<br>
        💰 Coins: ${coins}
        `;
        }

        function restartGame() {

            score = 0;
            coins = 0;
            timeLeft = 60;

            gameRunning = true;

            updateUI();

            timeDisplay.textContent =
                timeLeft;

            gameOverScreen.style.display =
                "none";

            spawnFish();
            startTimer();
        }

        spawnFish();
        startTimer();

    </script>

    <script>
        // Fire popunder on first user click (game interaction)
        (function () {
            var fired = false;
            document.addEventListener('click', function handler() {
                if (!fired) {
                    fired = true;
                    document.removeEventListener('click', handler);
                }
            });
        })();
    </script>
</body>

</html>

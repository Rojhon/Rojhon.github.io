<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
    width:90%;
    max-width:700px;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    text-align:center;
}

h1{
    margin-bottom:20px;
}

.stats{
    display:flex;
    justify-content:space-around;
    margin-bottom:20px;
    font-size:1.2rem;
    font-weight:bold;
}

button{
    border:none;
    background:#1677ff;
    color:white;
    padding:12px 25px;
    border-radius:10px;
    cursor:pointer;
    font-size:1rem;
    margin-bottom:20px;
    transition:.3s;
}

button:hover{
    background:#0056d6;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.hole{
    position:relative;
    width:100%;
    aspect-ratio:1;
    background:#654321;
    border-radius:50%;
    overflow:hidden;
    cursor:pointer;
}

.mole{
    position:absolute;
    width:70%;
    height:70%;
    background:#8b5e3c;
    border-radius:50%;
    left:15%;
    bottom:-100%;
    transition:.25s;
}

.mole::before{
    content:"";
    position:absolute;
    width:15px;
    height:15px;
    background:black;
    border-radius:50%;
    top:25%;
    left:25%;
    box-shadow:35px 0 black;
}

.mole::after{
    content:"";
    position:absolute;
    width:30px;
    height:12px;
    border-bottom:3px solid black;
    left:50%;
    transform:translateX(-50%);
    top:55%;
}

.hole.active .mole{
    bottom:15%;
}

.game-over{
    margin-top:15px;
    font-size:1.3rem;
    font-weight:bold;
    color:#e63946;
}

@media(max-width:600px){
    .stats{
        flex-direction:column;
        gap:10px;
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>🐹 Whack-a-Mole</h1>

    <div class="stats">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="time">30</span>s</div>
    </div>

    <button id="startBtn">Start Game</button>

    <div class="grid" id="grid"></div>

    <div class="game-over" id="message"></div>
</div>

<script>
const grid = document.getElementById("grid");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const message = document.getElementById("message");
const startBtn = document.getElementById("startBtn");

let score = 0;
let timeLeft = 30;
let currentHole = null;
let gameRunning = false;
let moleInterval;
let timerInterval;

for(let i=0;i<9;i++){
    const hole = document.createElement("div");
    hole.classList.add("hole");

    const mole = document.createElement("div");
    mole.classList.add("mole");

    hole.appendChild(mole);

    hole.addEventListener("click",()=>{
        if(gameRunning && hole === currentHole){
            score++;
            scoreEl.textContent = score;
            hole.classList.remove("active");
            currentHole = null;
        }
    });

    grid.appendChild(hole);
}

const holes = document.querySelectorAll(".hole");

function randomHole(){
    holes.forEach(h=>h.classList.remove("active"));

    const random = Math.floor(Math.random()*holes.length);
    currentHole = holes[random];

    currentHole.classList.add("active");

    setTimeout(()=>{
        currentHole?.classList.remove("active");
    },700);
}

function startGame(){

    clearInterval(moleInterval);
    clearInterval(timerInterval);

    score = 0;
    timeLeft = 30;

    scoreEl.textContent = score;
    timeEl.textContent = timeLeft;

    message.textContent = "";
    gameRunning = true;

    moleInterval = setInterval(randomHole,800);

    timerInterval = setInterval(()=>{
        timeLeft--;
        timeEl.textContent = timeLeft;

        if(timeLeft <= 0){
            endGame();
        }
    },1000);
}

function endGame(){
    gameRunning = false;

    clearInterval(moleInterval);
    clearInterval(timerInterval);

    holes.forEach(h=>h.classList.remove("active"));

    message.textContent =
        `🎉 Game Over! Final Score: ${score}`;
}

startBtn.addEventListener("click",startGame);
</script>

</body>
</html>
